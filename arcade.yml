name: generate arcade contribution graphs

on:
  schedule:
    - cron: '0 0 * * *'      # Запуск каждый день в 00:00
  workflow_dispatch:          # Ручной запуск
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: generate contribution graph SVGs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: daqsi1488
          # Указываем только Galaga, но можно добавить и другие игры через запятую
          games: 'galaga'

      - name: push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
