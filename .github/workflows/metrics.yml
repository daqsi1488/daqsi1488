name: Metrics
on:
  schedule:
    - cron: '0 0 * * *'  # каждый день в 00:00 UTC
  workflow_dispatch:      # можно запускать вручную

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: daqsi1488
          template: classic
          base: ''
          
          # 📊 Основная секция с языками
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_threshold: 1%
          plugin_languages_sections: most-used
          plugin_languages_indentation: 2
          
          # 🎨 Дополнительные фичи (опционально)
          plugin_lines: yes           # показывает строки кода
          plugin_lines_history_limit: 1
          
          # 💅 Настройки внешнего вида
          config_timezone: Europe/Moscow
          filename: metrics.svg
          git_branch: metrics          # 👈 ЭТО НУЖНО ДОБАВИТЬ
